edition = "2023";

package turboci.orchestrator.v1;

import "turboci/orchestrator/v1/datum.proto";

option go_package = "go.chromium.org/turboci/proto/go/orchestrator/v1;orchestrator";
option java_multiple_files = true;

// A view of the data for a single Check.Result.
message CheckResultView {
  // The current data for each data type in this Result.
  repeated Datum data = 1;
}
