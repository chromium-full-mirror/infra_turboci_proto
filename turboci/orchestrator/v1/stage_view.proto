edition = "2023";

package turboci.orchestrator.v1;

import "turboci/orchestrator/v1/stage.proto";
import "turboci/orchestrator/v1/stage_edit_view.proto";

option go_package = "go.chromium.org/turboci/proto/go/orchestrator/v1;orchestrator";
option java_multiple_files = true;

// StageView is a collated, partial, view of a single Stage and the nodes
// which belong to it.
message StageView {
  // The Stage itself - always present.
  Stage stage = 1;

  // TBD: Stage Attempt Progress data.
  // ... = 2;
  reserved 2; // reserved for progress data.

  // StageEdits for this Stage which are being read.
  //
  // Some StageEdits may be omitted if the user did not request them.
  repeated StageEditView edits = 3;
}
